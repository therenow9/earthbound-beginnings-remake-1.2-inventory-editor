name: Tests

# Runs on every push and pull request. The release workflow runs these too,
# but having them here means a branch or PR gets checked without waiting for
# a release, and a red tick shows up on the commit.

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows because the GUI tests drive real tkinter widgets. They skip
    # themselves where there is no display, but then they would not be
    # testing anything.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check the item table still matches the saves it was derived from
        # Cheap guard against data/items.json being edited by hand into
        # something that disagrees with the ids confirmed on real saves.
        run: |
          python -c "
          from ebbr import items
          items.load_default()
          bad = [f'0x{i:02X}' for i, s in items.EQUIP_EVIDENCE.items()
                 if items.equip_slot(i) != s]
          raise SystemExit('equip slots disagree with real saves: ' + ', '.join(bad) if bad else 0)
          "
