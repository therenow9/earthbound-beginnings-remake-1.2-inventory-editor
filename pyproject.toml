[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebbr-save-editor"
dynamic = ["version"]
description = "Save editor for EarthBound Beginnings Remake (SNES ROM hack)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7"]

[project.scripts]
ebbr = "ebbr.cli:main"

[project.gui-scripts]
ebbr-gui = "ebbr.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Keeps the version in one place; see src/ebbr/__init__.py.
version = { attr = "ebbr.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
